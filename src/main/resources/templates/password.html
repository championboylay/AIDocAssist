<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Ported from SKB password.html. Here every user has a password, so everyone gets this page. -->
<head th:replace="~{fragments :: head('AI Doc Assist — change password', null)}"></head>
<body>
<main class="centered">
  <div class="stack">
    <div class="brand"><b>AI Doc Assist</b><span>SIP document assistant</span></div>
    <form class="card" method="post" th:action="@{/account/password}">
      <div>
        <h1>Change password</h1>
        <div class="sub"><th:block th:text="${user.username}">username</th:block> &middot; at least 10 characters. Other devices will be logged out.</div>
      </div>
      <div class="field">
        <label for="current">Current password</label>
        <input id="current" name="current" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="next">New password</label>
        <input id="next" name="next" type="password" autocomplete="new-password" minlength="10" required>
      </div>
      <div class="field">
        <label for="confirm">Repeat new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
      </div>
      <div th:if="${error}" class="error" role="alert" th:text="${error}"></div>
      <div th:if="${done}" class="success" role="status">Password changed.</div>
      <button class="btn" type="submit">Change password</button>
      <a th:href="@{/}">&larr; Back</a>
    </form>
  </div>
</main>
</body>
</html>

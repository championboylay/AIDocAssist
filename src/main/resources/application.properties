# Settings come from (highest wins): environment variables, then .env in the working directory
# (KEY=VALUE, git-ignored), then the defaults below.
spring.config.import=optional:file:.env[.properties]

# --- Models -------------------------------------------------------------------------------------
# Ollama: the fallback for embeddings, and for answers when no DeepSeek key is set.
ollama.url=${OLLAMA_URL:http://localhost:11434}
embed.model=${EMBED_MODEL:qwen3-embedding:8b}
chat.model=${CHAT_MODEL:frob/qwen3.5-instruct:4b}
# Answers and follow-up rewrites: DeepSeek when DEEPSEEK_API_KEY is set, otherwise Ollama (chat.model).
deepseek.url=${DEEPSEEK_URL:https://api.deepseek.com}
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
# Embeddings: Google AI Studio keys, comma-separated, tried in order; Ollama (embed.model) when all fail.
gemini.api-keys=${GEMINI_API_KEYS:}
gemini.embed-model=${GEMINI_EMBED_MODEL:gemini-embedding-2}
# Per-key budgets, kept below the free tier's 100 requests/min, 30k tokens/min, 1000 requests/day.
gemini.rpm=${GEMINI_RPM:80}
gemini.tpm=${GEMINI_TPM:25000}
gemini.rpd=${GEMINI_RPD:950}

# --- Storage: back up the database file and the upload folder together -------------------------
db.path=${DB_PATH:data/aidocassist.db}
# Uploaded originals: <UPLOAD_DIR>/<entry id>/<file>. The app is their only keeper.
upload.dir=${UPLOAD_DIR:uploads}
# Upload size is checked by the app (20 MB per file, a clear message per file), not by the servlet limit.
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# --- First admin: created on start only if no admin exists (email optional). Set in .env, never commit.
admin.username=${ADMIN_USERNAME:}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# --- Web: SKB serves its files under /static/; sessions last one working day, cookie SameSite=Lax.
server.servlet.context-path=/docassist
spring.mvc.static-path-pattern=/static/**
server.servlet.session.timeout=10h
server.servlet.session.cookie.name=aidocassist_session
server.servlet.session.cookie.same-site=lax

# --- H2 web console as a SQL browser on the SQLite file: /docassist/h2-console, admins only,
# localhost only. Driver Class org.sqlite.JDBC, JDBC URL jdbc:sqlite:<DB_PATH>, user/password empty.
spring.h2.console.enabled=true

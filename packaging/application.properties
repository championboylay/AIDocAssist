# AI Doc Assist settings. Edit, then restart the app.
# An environment variable of the name in ${...} overrides the value after the colon.

# Ollama on SIP's server: the fallback for embeddings, and for answers when no DeepSeek key is set.
ollama.url=${OLLAMA_URL:http://localhost:11434}
embed.model=${EMBED_MODEL:qwen3-embedding:8b}
chat.model=${CHAT_MODEL:frob/qwen3.5-instruct:4b}

# Outside services (document text is sent to them). Answers and follow-up rewrites: DeepSeek when DEEPSEEK_API_KEY is set, otherwise Ollama (chat.model).
deepseek.url=${DEEPSEEK_URL:https://api.deepseek.com}
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
# Embeddings: Google AI Studio keys, comma-separated, tried in order; Ollama (embed.model) when all fail.
gemini.api-keys=${GEMINI_API_KEYS:}
gemini.embed-model=${GEMINI_EMBED_MODEL:gemini-embedding-2}
# Per-key budgets, kept below the free tier's 100 requests/min, 30k tokens/min, 1000 requests/day.
gemini.rpm=${GEMINI_RPM:80}
gemini.tpm=${GEMINI_TPM:25000}
gemini.rpd=${GEMINI_RPD:950}

# Where the database and uploaded files live, relative to this folder.
# Back up BOTH together: the app is the only keeper of uploaded originals.
db.path=${DB_PATH:data/aidocassist.db}
upload.dir=${UPLOAD_DIR:uploads}

# First admin: created at start only if no admin exists yet. Password at least 10 characters.
# Remove the password from this file once you have logged in and changed it.
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}
admin.email=${ADMIN_EMAIL:}

# Web port. Colleagues open http://<this machine>:8080
server.port=8080
server.servlet.context-path=/docassist

# Example questions on the new-thread page, separated by |
chat.examples=${CHAT_EXAMPLES:}

# Log file (the console window shows the same).
logging.file.name=logs/aidocassist.log
